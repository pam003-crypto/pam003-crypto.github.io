<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <title>Calculator</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>

  <body>
    <main class="phone-frame">
      <section class="calculator" aria-label="Calculator">
        <div class="status-pill" aria-hidden="true"></div>
        <output class="display" id="mainDisplay" aria-live="polite">0</output>

        <section class="keys" aria-label="Calculator keypad">
          <button class="function backspace-icon" type="button" data-action="backspace" aria-label="Backspace"></button>
          <button class="function" type="button" data-action="clear">AC</button>
          <button class="function" type="button" data-action="percent">%</button>
          <button class="operator" type="button" data-action="divide" aria-label="Divide">&divide;</button>

          <button type="button" data-digit="7">7</button>
          <button type="button" data-digit="8">8</button>
          <button type="button" data-digit="9">9</button>
          <button class="operator" type="button" data-action="next" aria-label="Multiply">&times;</button>

          <button type="button" data-digit="4">4</button>
          <button type="button" data-digit="5">5</button>
          <button type="button" data-digit="6">6</button>
          <button class="operator" type="button" data-action="next" aria-label="Minus">&minus;</button>

          <button type="button" data-digit="1">1</button>
          <button type="button" data-digit="2">2</button>
          <button type="button" data-digit="3">3</button>
          <button class="operator" type="button" data-action="plus" aria-label="Plus">+</button>

          <button class="zero" type="button" data-digit="0">0</button>
          <button type="button" data-action="dot">.</button>
          <button class="operator" type="button" data-action="unlock">=</button>
        </section>
      </section>
    </main>

    <script src="./script.js"></script>
  </body>
</html>
